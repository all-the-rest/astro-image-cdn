name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  verify:
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.1
          package-manager-cache: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.23.0
      - name: Validate the release tag
        run: |
          node --input-type=commonjs <<'NODE'
          const { version } = require('./package.json');
          const tag = process.env.GITHUB_REF_NAME;
          if (process.env.GITHUB_REF_TYPE !== 'tag' || !/^v\d+\.\d+\.\d+$/.test(tag) || tag.slice(1) !== version) {
            console.error(`Expected a vMAJOR.MINOR.PATCH tag matching package.json version ${version}; received ${tag}`);
            process.exit(1);
          }
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Pack verified package
        run: pnpm pack --pack-destination "$RUNNER_TEMP/npm-package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package
      - name: Verify pinned npm version
        run: test "$(npm --version)" = "11.6.2"
      - name: Publish verified tarball
        run: |
          package_tarball=$(find "$RUNNER_TEMP/npm-package" -maxdepth 1 -type f -name '*.tgz' -print -quit)
          test -n "$package_tarball"
          npm publish "$package_tarball" --access public --provenance --ignore-scripts
